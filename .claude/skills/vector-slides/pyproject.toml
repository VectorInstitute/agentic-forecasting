[project]
name = "vector-slides-skill"
version = "0.5.0"
description = "Vector Institute slide skill — build, validate, and QA decks from YAML"
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=1.0.0",
    "PyYAML>=6.0",
    "pdf2image>=1.17.0",
]

[project.scripts]
vector-slides = "vector_slides_skill.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vector_slides_skill"]
