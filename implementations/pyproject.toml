[project]
name = "aieng-implementations"
version = "0.1.0"
description = "Reference method implementations for the Agentic Forecasting Bootcamp"
authors = [{name = "Vector AI Engineering", email = "ai_engineering@vectorinstitute.ai"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aieng-forecasting",
    "lightgbm>=4.6.0",
    # litellm pinned to a single minor line; upgrades go through PR review.
    "litellm>=1.83,<1.84",
    "langfuse>=3.0,<5.0",
]

[tool.uv.sources]
aieng-forecasting = { workspace = true }

[tool.setuptools.packages.find]
include = ["methods*", "experiments*"]
