      to account for a systematic over-forecasting bias (+0.44 at 5bd, +0.86 at 10bd,
      +1.49 at 21bd) balanced against a fresh geopolitical risk premium (+0.63 at
      5bd, +0.67 at 10bd, +0.45 at 21bd) driven by the U.S. seizure of a sanctioned
      tanker on February 8 and Strait of Hormuz tensions.'
