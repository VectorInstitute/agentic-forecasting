      OPEC+ discipline supports prices while medium-term macro over-forecasting bias
      becomes more pronounced. Eight OPEC+ core members reaffirmed their production
      pause on February 1 through March 2026, which limits downward shocks. However,
      historical backtest evidence reveals a +0.86 systematic over-forecasting bias
      at 14d. To calibrate the baseline, we adjust the point forecast downward from
      the ARIMA baseline of $63.59 to $63.40 (incorporating the bias adjustment while
      retaining a partial geopolitical risk premium of +0.67). Consistent with our
      over-coverage observations, we scale down the prediction interval width from
      15.29 to 8.06 (scaling factor of ~0.527), aligning it with the calibrated target
      of 8.20.
