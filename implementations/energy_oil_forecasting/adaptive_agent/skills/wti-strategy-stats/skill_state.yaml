schema_version: '1.0'
approach_narrative: 'Produce calibrated probabilistic forecasts by combining two evidence
  streams:

  statistical analysis of recent price history and web-grounded news context.


  At short horizons (5 bd), momentum and recent trend dominate. Trust the trend

  projection output unless there is a strong near-term catalyst visible in news

  context (e.g. an imminent OPEC+ meeting or scheduled inventory release).


  At medium horizons (10 bd), OPEC+ meeting schedules and US inventory release

  dates matter. Check for scheduled events in the news context before finalising

  the forecast.


  At long horizons (21 bd), macro demand and geopolitical risk dominate. The

  statistical signal loses explanatory power at this horizon; weight news context

  and published analyst consensus more heavily than the trend projection.


  Always run statistical analysis (vol-regime, trend-projection) before

  incorporating news context. The regime classification and trend window

  directly inform interval calibration.'
calibration_corrections: []
hypotheses:
- id: hyp-001
  claim: My 80% prediction intervals are consistently too wide across all horizons
    (7d to 29d), leading to coverages significantly exceeding the 80% target, especially
    under the 'medium' volatility regime where coverage reaches 94% to 100%.
  status: open
  confirmations: 0
  refutations: 0
  opened_on: '2026-06-02'
- id: hyp-002
  claim: My AutoARIMA point forecasts exhibit a systematic upward (over-forecasting)
    bias across all horizons, which worsens as the forecast horizon increases and
    is particularly pronounced under the 'elevated' volatility regime at short-to-medium
    horizons and the 'medium' volatility regime at longer horizons.
  status: open
  confirmations: 0
  refutations: 0
  opened_on: '2026-06-02'
observations:
- date: '2026-06-02'
  finding: 80% prediction intervals are systematically too wide across all horizons
    in the 2025 backtest (51 origins), yielding coverages of 91.5% at 7d, 93.6% at
    14d, and 98.0% at 29d, which are significantly above the 80% target.
  linked_hypothesis: null
- date: '2026-06-02'
  finding: AutoARIMA has a systematic upward bias (over-forecasting) across all horizons
    in the 2025 backtest, with mean bias increasing with the horizon (+0.44 at 7d,
    +0.86 at 14d, and +1.49 at 29d).
  linked_hypothesis: null
- date: '2026-06-02'
  finding: The interval over-conservatism is especially severe in the 'medium' volatility
    regime, where 80% coverage is 94.1% at 7d, 97.1% at 14d, and 100.0% at 29d, indicating
    that prediction intervals are excessively wide under normal market conditions.
  linked_hypothesis: null
- date: '2026-06-02'
  finding: In the 'elevated' volatility regime, the 80% CI coverage is well-calibrated
    at short-to-medium horizons (81.8% at both 7d and 14d), but the point forecasts
    show a strong systematic upward bias (+1.68 at 7d, +1.58 at 14d).
  linked_hypothesis: null
- date: '2026-06-02'
  finding: In the 2025 WTI backtest over 51 origins, the 80% CI coverage was 91.5%
    at 7d (average width 10.94, width needed 7.30), 93.6% at 14d (average width 15.55,
    width needed 8.20), and 98.0% at 29d (average width 22.31, width needed 10.72).
    Under the 'medium' volatility regime, coverage was 94.1% at 7d, 97.1% at 14d,
    and 100.0% at 29d.
  linked_hypothesis: hyp-001
- date: '2026-06-02'
  finding: 'In the 2025 WTI backtest of 51 origins, the mean bias (forecast - actual)
    is positive across all horizons: +0.44 at 7d, +0.86 at 14d, and +1.49 at 29d.
    This over-forecasting is especially severe under the ''elevated'' volatility regime
    at short-to-medium horizons (+1.68 at 7d, +1.58 at 14d) and under the ''medium''
    volatility regime at the 29d horizon (+1.96).'
  linked_hypothesis: hyp-002
- date: '2026-06-02'
  finding: AutoARIMA exhibits negative relative skill against a simple last-value
    naive baseline at 7d (MAE 2.40 vs 2.34) and 29d (MAE 3.71 vs 3.59), and virtually
    identical skill at 14d (MAE 2.80 vs 2.81). This suggests that the model's complex
    forecasting patterns do not outperform a random walk model in WTI price projection.
  linked_hypothesis: null
- date: '2026-06-02'
  finding: In the 'extreme' volatility regime (N=2), the model exhibits a negative
    (under-forecasting) bias across all horizons (-1.35 at 7d, -1.21 at 14d, -1.19
    at 29d), which is the opposite of the positive bias seen in medium and elevated
    regimes.
  linked_hypothesis: null
- date: '2026-06-02'
  finding: 'The over-conservatism of the 80% prediction intervals increases with the
    forecast horizon: at 7d, the interval is 50% wider than needed (10.94 actual vs
    7.30 needed); at 14d, it is 90% wider (15.55 actual vs 8.20 needed); and at 29d,
    it is 108% wider (22.31 actual vs 10.72 needed).'
  linked_hypothesis: null
