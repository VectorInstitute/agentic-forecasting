# Palm Oil Smoke Spec — 2 origins, for pipeline checks
#
# The cheapest possible end-to-end exercise: two weekly origins, so the whole
# chain (data -> predictor -> backtest -> score) can be run in seconds. Use this
# first; only move to cpo_backtest.yaml once it passes.
#
# Target is MPOB, the physical price, in MYR per tonne. Horizons match
# cpo.plots.HORIZONS_WEEKS so smoke results are directly comparable to the
# scored runs.
#
# DATA: MPOB is approved for use (2026-08-11), locally and in Coder. The raw
# series still must never be committed. Populate the cache first with
# `uv run python scripts/fetch_mpob.py`.
#
# Origin count : 2
# Warmup       : 104 weeks (~2 years)

spec_id: cpo_smoke

description: >-
  Two-origin smoke backtest on the MPOB weekly crude palm oil price. Same task,
  horizons and warmup as cpo_backtest, but only 2 origins so the pipeline can be
  exercised end to end without waiting.

task:
  task_id: palm_oil_mpob_price_forecast
  target_series_id: palm_oil_mpob_weekly
  horizons: [1, 2, 4, 8, 13]
  frequency: W-FRI
  payload_type: continuous
  description: >-
    MPOB official crude palm oil price, "Local Delivered", Friday close in MYR
    per tonne, projected 1, 2, 4, 8 and 13 weeks ahead.

start: "2025-06-06"
end: "2025-06-13"
stride: 1
warmup: 104