# Palm Oil Backtest Spec — dense weekly rolling backtest, 2024–2025
#
# The model-selection run. cpo_cutoffs.yaml is the seven-origin narrative set
# that carries the event-vs-quiet story; this spec is the statistical companion
# that decides which model is genuinely better. 104 origins x 5 horizons = 520
# scored points, against the cutoff set's 35.
#
# Window: every Friday of 2024 and 2025. That is the stretch covered by the news
# pipeline, so the news-reading agent and the price-only baselines see the same
# information. 2026 is deliberately excluded and held for cpo_eval.yaml.
#
# Target is MPOB, the physical price, in MYR per tonne -- not the Yahoo CPO=F
# futures series the earlier drafts of this file used. MPOB needs no
# released_at correction (published next working day) and has no contract-roll
# artifact.
#
# DATA: MPOB is approved for use (2026-08-11), locally and in Coder. The raw
# series still must never be committed. Populate the cache first with
# `uv run python scripts/fetch_mpob.py`.
#
# Origin count : 104 (every Friday, 2024-01-05 -> 2025-12-26)
# Warmup       : 104 weeks (~2 years). MPOB history starts 2008, so warmup never
#                binds here -- it is a guard, not a filter.

spec_id: cpo_backtest

description: >-
  Dense weekly rolling backtest across 2024 and 2025 on the MPOB crude palm oil
  price, at horizons 1, 2, 4, 8 and 13 weeks, scored with CRPS. Used to rank
  models on a sample large enough to separate them; the seven narrative cutoffs
  in cpo_cutoffs.yaml then show how the leaders behave on events versus quiets.

task:
  task_id: palm_oil_mpob_price_forecast
  target_series_id: palm_oil_mpob_weekly
  horizons: [1, 2, 4, 8, 13]
  frequency: W-FRI
  payload_type: continuous
  description: >-
    MPOB official crude palm oil price, "Local Delivered", Friday close in MYR
    per tonne, projected 1, 2, 4, 8 and 13 weeks ahead.

start: "2024-01-05"
end: "2025-12-26"
stride: 1
warmup: 104
