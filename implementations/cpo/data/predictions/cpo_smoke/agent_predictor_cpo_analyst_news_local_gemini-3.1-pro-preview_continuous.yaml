  metadata:
    rationale: CPO prices currently face competing forces. Seasonally rising production
      in Malaysia and climbing stockpiles provide bearish pressure in the near term.
      However, this is largely offset by India's decision to halve its import duty
      on crude edible oils to 10%, which has rapidly spurred demand. Furthermore,
      Indonesia's B40 biodiesel mandate and their 10% export levy hike keep a tight
      grip on global supply. As a result, prices are expected to experience a mild
      softening due to the seasonal inventory build through Q3, before stabilizing.
      Forecasts anticipate range-bound movement generally around RM 3850-3900/tonne,
      with expanding uncertainty bands over longer horizons to capture risks related
      to weather, crude oil markets, and substitutable oilseed supplies.
    horizon_rationale: Near-term prices are expected to remain anchored near recent
      prints. The recent move by India to cut the basic import duty on crude edible
      oils to 10% provides immediate demand support, offsetting initial pressures
      from rising Malaysian inventories.
