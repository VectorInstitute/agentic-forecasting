  metadata:
    rationale: 'Currently, the MPOB price balances two powerful counteracting forces:
      rising Malaysian inventories from robust production recovery, against a massive
      demand spike prompted by India halving its edible oil import duties. Additionally,
      Indonesia''s decision to hike its CPO export levy effectively grants a competitive
      advantage to Malaysian shipments. Over the near term, we expect prices to trace
      a tight range around 3850-3950 MYR/t, facing slight downward drift towards peak
      production season before a potential recovery curve initiates heading into Q4.
      Key variables defining the wider bounds include crude oil weakness undercutting
      biodiesel margins and competitive fluctuations from global soy and sunflower
      seed crops.'
    horizon_rationale: Over a 1-week horizon, prices are likely to consolidate around
      the 3900 MYR/t level. Despite high Malaysian stockpiles nearing 2 million tonnes,
      massive export off-take following India's import duty halving provides strong
      short-term support.
