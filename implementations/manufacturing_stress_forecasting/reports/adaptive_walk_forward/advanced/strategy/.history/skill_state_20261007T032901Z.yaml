schema_version: '1.0'
approach_narrative: 'Start from the numerical hybrid anchor and apply upward adjustments
  when severe IPMAN declines or high financial stress indicate heightened risk. Apply
  downward adjustments only when short-term IPMAN growth is positive and financial
  indicators are stable. Rationale: Resolved feedback from recent origins shows the
  anchor severely under-forecasts stress during periods of negative stock returns,
  elevated VIX, and deep IPMAN contractions.'
calibration_corrections:
- condition: When IPMAN three-month growth is positive.
  adjustment: Reduce the forecast probability below the anchor by 0.01 to 0.015.
  source_hypothesis: hyp-001
  confirmed_on: origin-007
- condition: When three-month stock returns are negative and VIX is elevated.
  adjustment: Increase the forecast probability above the anchor by 0.05 to 0.15.
  source_hypothesis: hyp-002
  confirmed_on: origin-013
hypotheses:
