deck:
  title: The Adaptive Agent
  subtitle: An agent that rewrites its own strategy
  author: { name: "Ethan Jackson", org: "Vector Institute", date: "July 2026" }
  footer: true
  include_title: false   # slide 1 is an explicit title_photo

slides:
  # 1 — Title
  - layout: title_photo
    title: The Adaptive Agent
    subtitle: "Energy markets, part 2 — an agent that rewrites its strategy"
    notes: |
      Ali just showed you what it looks like to evaluate an agent's reasoning from
      the outside — using an LLM-as-a-judge to ask whether the agent's thinking
      matches the way the Bank of Canada actually frames its decisions. I want to
      show you the natural extension of that idea: what happens when the agent uses
      its own performance as a signal to improve itself? Not us evaluating it — but
      the agent studying its own forecasting errors, finding patterns, and updating
      its strategy based on what it finds. That's the Adaptive Agent, and it's the
      second part of the energy use case. I'm going to start with something you
      already know.

  # 2 — Agenda
  - layout: icon_cards
    title: What we'll cover
    cards:
      - { icon: arrow, title: "From analyst to learner", accent: pink,
          body: "Yesterday's Analyst Agent with exactly one new box — a mutable strategy file it reads before every forecast and rewrites after." }
      - { icon: gear, title: "The mechanism", accent: purple,
          body: "Four evidence layers, five typed write-tools, and an in-code gate that decides when a finding is allowed to change the forecast." }
      - { icon: chart, title: "What it discovered", accent: blue,
          body: "A real finding from its 2025 curriculum, then a +5% before/after on a protected 2026 window — the Strait of Hormuz shock." }
    callout: "One architectural addition turns a capable forecaster into a learner."
    notes: |
      Three beats. First, the conceptual bridge: what makes a forecaster adaptive,
      and how the Adaptive Agent differs from the Analyst Agent you saw yesterday —
      which is actually just one architectural addition. Second, the mechanism: the
      mutable strategy state, the typed tools, the evidence bars. And third, what it
      actually discovered: a concrete finding from the curriculum session, and a
      before/after on a protected 2026 eval window — the window covering the
      geopolitical shock period that made 2026 one of the harder forecasting
      environments we could have tested on. I'll close honestly on what we still
      don't have — and hand to the next session where the research landscape takes
      these ideas much further.

  # 3 — One addition, not a new agent
  - layout: compare
    title: One addition, not a new agent
    left:
      label: Analyst Agent
      lines:
        - "Strategy fixed at config time"
        - "Instructions never change between runs"
        - "Same capable analyst, every single run"
    right:
      label: Adaptive Agent
      lines:
        - "Strategy is a mutable skill file"
        - "Updates from its own forecasting experience"
        - "Same analyst — now carrying a memory"
    callout: "Identity, tools, output schema, Predictor interface — all identical. One box changes."
    notes: |
      Let me start with the bridge from yesterday. The Analyst Agent is a capable
      forecaster — news search, code execution, skills for statistical analysis and
      trend projection. Its strategy — how it weights signals at different horizons,
      when it trusts the trend versus the news — is fixed at config time. I told you
      yesterday there was a dashed box in the architecture diagram labeled
      'extensible.' The Adaptive Agent fills that box. Everything else — the agent
      identity, the tools, the output schema, the Predictor interface — is identical.
      The one addition: the strategy is now a mutable file the agent reads at the
      start of every prediction and can update across sessions. Same analyst. Now it
      carries a memory that evolves.

  # 4 — The architecture, filled in
  - layout: figure_full
    title: The architecture, filled in
    image: ../../assets/figures/d2-02/agent_architecture_adaptive.png
    caption: "The dashed slot from d1-04, now solid: five typed tools, the only write path."
    notes: |
      Here's the architecture diagram from yesterday — same layout, same
      AgentPredictor wrapper. The dashed box is now solid. Inside: a WtiStrategyState
      Pydantic model persisted to disk as YAML and rendered to a SKILL.md that the
      agent reads. The agent updates it through five narrow typed tools —
      record_observation, open_hypothesis, and so on. The critical architectural
      point: those mutation tools run in the host process, not inside the E2B
      sandbox. The agent can call them like any other function tool, but they read
      and write the skill directory on the local filesystem. That's what makes this
      safe and auditable — the agent has five specific operations and nothing else.
      It cannot write arbitrary content to its own strategy.

  # 5 — The conceptual shift
  - layout: statement
    statement: "It accumulates experience, not just context."
    support: "Observations, hypotheses, and corrections carry from session to session — a living document the agent reads at every prediction."
    callout: "The strategy is the memory."
    notes: |
      The conceptual shift in one sentence. The Analyst Agent has context — the news,
      the price history, the statistical analysis. Every run starts fresh; nothing
      carries forward between invocations. The Adaptive Agent accumulates experience.
      Its strategy file is a living document that carries observations, hypotheses,
      and calibration corrections from one session to the next. When it forecasts
      today, it is drawing on what it learned from the last year of forecasting
      history — not just what it sees right now.

  # 6 — Section break
  - layout: section
    eyebrow: The mechanism
    title: Structured memory, governed
    subtitle: "What the agent can update — and the evidence each layer demands"
    notes: |
      Let's look at the implementation — the four-layer evidence hierarchy, the
      typed tools that are the only write path, and the in-code gate that decides
      when a finding is allowed to change how the agent forecasts.

  # 7 — Four layers, four evidence bars
  - layout: table
    title: Four layers, four evidence bars
    headers: ["Layer", "Mutation tool", "Evidence bar to update it"]
    rows:
      - ["Observations", "record_observation", "A pattern that holds across ≥2 forecasts"]
      - ["Hypotheses", "open_hypothesis", "One strong, durable-looking observation"]
      - ["Calibrations", "graduate_hypothesis", "Confirmations ≥ threshold (enforced in code)"]
      - ["Approach narrative", "update_approach_narrative", "A structural shift, not a single result"]
    highlights:
      - { row: 2, col: 1, color: card_green }
    callout: "Bottom-up: you can't reach a calibration without the observation and hypothesis that earn it."
    notes: |
      The strategy file has four layers, and each has its own evidence bar.
      Observations are the cheapest: record any finding that holds across at least
      two forecasts — not a single miss, which is just noise. Hypotheses are
      candidate corrections under testing — open one when observations suggest a
      durable pattern. Calibrations are the actionable layer: a hypothesis becomes a
      calibration correction only when it has accumulated enough confirming outcomes,
      and the tool enforces this in code — we'll see that in a moment. And the
      approach narrative — the overall forecasting philosophy — only updates when the
      calibration record reveals something structural that the description no longer
      captures. The governance rule is bottom-up: you cannot jump to a calibration
      without the observation and hypothesis record that earns it. The meta-learning
      skill spells all of this out and the agent reads it before making any update.

  # 8 — The five write-tools (the only write path)
  - layout: code
    title: The only way it can write to itself
    language: python
    code: |
      # the agent's only write path
      record_observation(...)
      open_hypothesis(...)
      record_hypothesis_outcome(...)
      graduate_hypothesis(...)  # gate
      update_approach_narrative(...)
    side:
      heading: "Five verbs, nothing else."
      body: "No free-form writes — every change to its memory goes through one typed tool."
      points:
        - "Each maps to one evidence layer"
        - "graduate_ carries the gate"
    caption: "adaptive_agent/skill_tools.py"
    notes: |
      Before the gate, the tools themselves. This is the agent's entire write API to
      its own strategy — five typed functions, nothing else. It cannot open the
      SKILL.md and type whatever it wants; every change to its memory goes through one
      of these five verbs, each tied to one layer of the evidence hierarchy you just
      saw. record_observation logs a finding; open_hypothesis proposes a pattern;
      record_hypothesis_outcome tallies a confirmation or refutation;
      graduate_hypothesis tries to promote a hypothesis into an actionable calibration
      — and carries the gate we're about to look at; update_approach_narrative rewrites
      the top-level philosophy. Narrow, typed, auditable. That constraint is the whole
      reason this is safe to let run.

  # 9 — The in-code accept/reject gate
  - layout: code
    title: The in-code accept/reject gate
    language: python
    code: |
      # graduate_hypothesis enforces the gate
      if confirms < threshold:
          short = threshold - confirms
          return (
              f"Cannot graduate {hyp_id}: "
              f"have {confirms}, "
              f"need {threshold}. "
              f"Record {short} more."
          )
    side:
      heading: "The gate is in code."
      body: "The agent can't talk its way past the threshold (set to 2)."
      points:
        - "Returns the exact shortfall"
        - "Forces more evidence first"
        - "Not a prompt — a hard rule"
    caption: "adaptive_agent/skill_tools.py:313"
    notes: |
      Here's the gate. graduate_hypothesis — the tool that would promote a hypothesis
      to a calibration correction — checks the confirmation count against the
      threshold, which we set to 2. If the hypothesis doesn't have enough confirming
      outcomes yet, the tool returns this message: the current count, the required
      count, and the shortfall. The agent reads this; it cannot graduate the
      hypothesis. It has to go back and accumulate more evidence. This is the key
      design discipline — not just a prompt that says 'be conservative,' but a
      code-enforced rule the agent simply cannot work around. It's a lightweight
      version of the same principle you'll see in the research papers in the next
      session, where they call it an empirical accept/reject gate. We built a version
      of it from first principles.

  # 10 — Section break
  - layout: section
    eyebrow: Curriculum
    title: What it discovered
    subtitle: "NB05 self-directed study on 2025 → NB06 protected 2026 eval"
    notes: |
      With the architecture clear — let's see what the agent actually learned, and
      then test whether that learning held up on a hard, protected 2026 window it
      never saw during study.

  # 11 — The curriculum: the agent studies itself (real trace)
  - layout: code
    title: It ran its own 2025 study
    language: python
    code: |
      # the agent wrote and ran this (excerpt)
      raw = yf.Ticker("CL=F").history(
          start="2024-09-01", end="2026-02-15")
      d["ret"] = np.log(d.close / d.close.shift(1))
      d["vol21"] = (d.ret.rolling(21).std()
                    * np.sqrt(252) * 100)
      # regimes -> trend vs flat MAE per horizon
    side:
      heading: "Self-directed study."
      body: "52 weekly 2025 summaries + price history — it hunts its own systematic error."
      points:
        - "Study → record → try to graduate"
        - "Then freeze → protected 2026 eval"
    caption: "curriculum/study_response.txt (NB05)"
    notes: |
      This is the curriculum — notebook 5 — and the key thing is the agent runs it
      itself. We give it a year of 2025 context: 52 weekly news summaries covering
      OPEC+ decisions and geopolitics, plus WTI price history up to each week. Then we
      let it study, and it writes and runs real code — this is a verbatim excerpt: it
      pulls the price series, computes log returns and a 21-day rolling annualised
      volatility, classifies regimes, and backtests its trend-projection method against
      a flat-trend baseline at each horizon. When it finds a systematic error it records
      an observation; when observations suggest a durable pattern it opens a hypothesis;
      when a hypothesis accumulates enough confirmations it tries to graduate — and the
      in-code gate accepts or rejects. Then we freeze the strategy and score it on a
      protected 2026 window it never saw. This isn't us running an analysis for the
      agent — it's the agent doing the analysis on itself.

  # 12 — The finding (real plot)
  - layout: figure
    title: What the agent found
    image: ../../assets/figures/d2-02/wti_flat_vs_trend_mae.png
    caption: "The agent's own 2025 WTI backtest — logged as hyp-001."
    side:
      heading: "Trend breaks in high vol."
      body: "In elevated vol the linear trend blows out — 3× worse than simply holding the last price."
      stats:
        - { value: "$11.95", label: "trend MAE · 21bd", color: red }
        - { value: "$3.91", label: "flat-trend MAE · 21bd", color: green }
    notes: |
      Here's what the agent discovered. In a full-year 2025 backtest it ran itself,
      it compared its statistical trend-projection method — fit a linear trend to
      recent price history, extrapolate to each horizon — against a simple flat-trend
      forecast that just holds the current price. In normal vol, trend projection is
      fine. But in elevated and extreme vol regimes — the kind of market 2026
      delivered — trend projection consistently blows out. At the 21-day horizon in
      elevated vol, trend MAE is 11.95 dollars versus the flat forecast's 3.91. More
      than three times the error. The agent recorded this finding with the actual
      numbers in its observations table, linked it to hypothesis hyp-001 — 'trend
      projection underperforms flat-trend in elevated vol regimes.' In the committed
      trained strategy, hyp-001 is open and the calibration correction is pending
      graduation — the in-code gate is holding it below the confirmation threshold,
      exactly as designed. The agent still reads the open hypothesis and its
      observations at prediction time, which is how the finding reaches the live 2026
      rationale we'll see in a moment.

  # 13 — Seed vs trained strategy (the real self-rewritten state)
  - layout: code
    title: The state it rewrote
    language: yaml
    code: |
      # seed: lists empty → after study:
      hypotheses:
      - id: hyp-001     # open, gate 0/2
        claim: trend < flat, high vol
      observations:
      - finding: 21bd MAE 11.95 vs 3.91
    side:
      heading: "It earned every line."
      body: "Same approach narrative — but a hypothesis and three observations it didn't have before."
      points:
        - "Calibrations still empty"
        - "The gate is holding hyp-001"
    caption: "wti-strategy{,-trained}/skill_state.yaml"
    notes: |
      The before and after are just files in the repo — you can diff them. The seed
      strategy the agent starts with has a sensible approach narrative (short horizons
      trust momentum, long horizons trust news and consensus) and three empty lists:
      no observations, no hypotheses, no calibration corrections. After one curriculum
      session, this is what it wrote: the observations table now holds the actual MAE
      numbers from the backtest it ran, and hypothesis hyp-001 is open, linked to that
      evidence. Two things it did NOT do, both correct: the approach narrative is
      unchanged — it judged it didn't yet have enough evidence for a structural rewrite
      — and the calibration-corrections list is still empty, because the gate is holding
      hyp-001 below the confirmation threshold. This is the evidence hierarchy working
      exactly as designed: disciplined, incremental, and every line earned.

  # 14 — The window we forecast through (the shock)
  - layout: figure
    title: The window we forecast through
    image: ../../assets/figures/d2-02/shock_window.png
    caption: "WTI · the agent's rolling 21-day-ahead forecast · 8 origins"
    side:
      heading: "The hardest window we could pick."
      body: "Mid-60s to ~110 and back as the Strait of Hormuz closed."
      points:
        - "Its 21-day call lags the shock"
        - "The band misses it — honest"
    notes: |
      Before the score, look at what it had to forecast. The black line is the real WTI
      path over the protected window; the pink line is the trained agent's rolling
      21-day-ahead forecast — its three-weeks-out call from each of the 8 weekly origins,
      with the 80% band. This is about the hardest window we could have picked: a
      structural regime break when the Strait of Hormuz effectively closed, WTI running
      from the mid-60s to near 110 dollars and back in weeks. Watch the lag: the pink
      call stays flat and low while the black price spikes — because those forecasts were
      made three weeks earlier, before the news, and nobody forecasts a geopolitical
      closure from price history. Then it catches up as the shock enters its information,
      and the band misses the spike entirely. That's the honest picture. Now — did the
      curriculum actually help on this?

  # 15 — Protected eval result (before/after with ±1 SE)
  - layout: figure
    title: Before/after on the 2026 eval
    image: ../../assets/figures/d2-02/eval_crps_comparison.png
    caption: "Lower CRPS is better · ±1 SE whiskers · 8 protected origins"
    side:
      heading: "It changed — within noise."
      body: "−5% vs untrained, but far inside ±1 SE. Change isn't demonstrated improvement."
      stats:
        - { value: "−5%", label: "trained vs untrained", color: ink }
        - { value: "≪ 1 SE", label: "gap vs noise (n=8)", color: red }
    notes: |
      Now the score, and I'm going to be straight with you. Both adaptive variants
      clear the AutoARIMA (11.00) and Naive (13.64) baselines, and the trained agent
      improved mean CRPS from 9.60 to 9.12 — about 5%. But look at the whiskers: those
      are ±1 standard error, and the trained and untrained bars overlap almost
      completely. The gap between them is 0.49; the combined standard error is 2.45.
      On 8 origins, this ~5% "improvement" is not statistically distinguishable from
      noise. I could show you the number without the error bars and it would look like
      a win — but that would be exactly the dishonesty we spent yesterday's session
      warning about. The mechanism is real and auditable, which I'll show you next in
      the live rationale. But whether the *change* is genuine *improvement* — that we
      cannot claim from this. Hold that thought; it's the whole reason the next session
      exists.

  # 16 — The mechanism, visible in the rationale
  - layout: code
    title: Visible in the live rationale
    language: text
    code: |
      "To prevent extrapolation error (which
      would project $68.76 via a linear model),
      we anchor our point forecast on the
      AutoARIMA baseline of $62.99 — a flat,
      stable trend with much lower MAE in
      backtesting. The 80% interval [$55.66,
      $70.99] uses split-normal interpolation
      for the elevated volatility regime."
    side:
      heading: "Not a rule we gave it."
      body: "It cites the curriculum finding in its live Feb-9-2026 rationale."
      points:
        - "Anchors by strategy, not instruction"
        - "Traceable to the 2025 backtest"
        - "Real numbers, this origin"
    caption: "eval_Agent__trained.json · as_of 2026-02-09"
    notes: |
      This is the most important slide. This is the trained agent's rationale on one
      of the 2026 origins — February 9th, elevated vol. It explains: a linear model
      would project $68.76, so to prevent that extrapolation error it anchors its
      point forecast to the AutoARIMA baseline of $62.99 — the flat, stable trend
      that had much lower MAE in backtesting — and builds the 80% interval with a
      split-normal calibration for the elevated-vol regime. That's the finding from
      the curriculum, applied with real numbers. We did not write that into the
      agent's instructions. The agent learned it during curriculum study, encoded it
      in its strategy file, and applied it here because its wti-strategy skill says
      to. The mechanism is not just working — it's visible and readable. You can trace
      from the 2025 backtest data, through the observation record, through the
      hypothesis, to the calibration that produced this rationale on this specific
      origin in 2026. That's what auditable adaptation looks like.

  # 17 — What we still don't have
  - layout: cards_dense
    title: What we still haven't done
    columns: 3
    style: outline
    cards:
      - { eyebrow: "01", title: "No validation gate", metric: "unproven", accent: pink,
          desc: "Updates commit without checking held-out improvement." }
      - { eyebrow: "02", title: "No archive", metric: "single point", accent: purple,
          desc: "One live strategy — nothing to fall back on if a turn goes wrong." }
      - { eyebrow: "03", title: "No learned schema", metric: "our design", accent: blue,
          desc: "The four layers are ours — the agent works within them, didn't discover them." }
    callout: "The change is visible. But is 'change' the same as 'improve'?"
    notes: |
      Let me be honest about three things we don't have. First: no validation gate.
      When the agent committed the flat-trend calibration correction, we didn't
      independently verify that the update would improve held-out CRPS. We saw a 5%
      improvement — but we can't be certain the update caused it, or that the update
      was the best possible one, because we never validated it against data the agent
      hadn't already used for study. Second: no archive. There's one live strategy. If
      the curriculum took a wrong turn and encoded a bad pattern, there's no
      collection of alternative strategies to fall back on. And third: the schema
      itself — observations, hypotheses, calibrations, narrative — that was our
      design. The agent works within it beautifully, but it didn't discover that
      structure. The question of whether a different structure would work better is
      one we haven't asked. The research papers in the next session are about what
      happens when you take each of these constraints seriously.

  # 18 — Handoff
  - layout: statement
    statement: "It changes. Does it improve?"
    support: "Auditable, yes — but a 5% gain inside the noise isn't proof. Improvement vs drift is what the next session answers."
    callout: "Next: d2-03 — Self-improving Agentic Systems"
    notes: |
      The Adaptive Agent changes over time. Its strategy evolves, the mechanism is
      auditable, and the 5% improvement on a very hard window is encouraging. But
      'change' and 'improve' are not the same thing. An agent without a held-out
      validation gate could be drifting — encoding noise as signal, overfitting to the
      recent surprises of a curriculum window. We can't tell the difference from the
      outside, and the agent can't tell the difference from the inside. The next
      session looks at the research that formalises this distinction — and at the
      single most impactful thing you could add to this implementation to go from 'an
      agent that changes' to 'an agent that has a good shot at genuinely improving.'
