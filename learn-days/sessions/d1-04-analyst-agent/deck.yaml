deck:
  title: The Analyst Agent
  subtitle: From LLM Processes to agents that fetch and compute
  author: { name: "Ethan Jackson", org: "Vector Institute", date: "July 2026" }
  footer: true
  include_title: false   # slide 1 is an explicit title_photo

slides:
  # 1 — Title (gradient hero; add `image:` to use a photo)
  - layout: title_photo
    title: The Analyst Agent
    subtitle: From LLM Processes to agents that fetch and compute
    notes: |
      Ali just showed you LLM Processes — packing a series and its context into a
      prompt and reading a forecast back out. I want to take exactly one step past
      that. What happens when the model doesn't just receive context, but can go get
      it — search the news, run a calculation — and decide for itself when to do
      which? That's an agent. For the next half hour we'll look at the architecture of
      one — the Analyst Agent, forecasting WTI crude — watch it react to live news,
      and be honest about the one problem agents create that ARIMA never had.

  # 2 — Agenda
  - layout: icon_cards
    title: What we'll cover
    cards:
      - { icon: arrow, title: "From LLMP to agents", accent: pink,
          body: "The agent goes and gets its context — on the same Predictor interface." }
      - { icon: robot, title: "Anatomy + capabilities", accent: purple,
          body: "Its components, and the staircase of which ones are live. We run it live." }
      - { icon: bug, title: "A leak we shipped", accent: blue,
          body: "Our best forecaster was cheating. How we caught it, fixed it, what it means." }
      - { icon: chart, title: "One agent, three jobs", accent: cyan,
          body: "Trajectory, shock, or scenario — where Track 2 first appears." }
    callout: "The honest tension in beat three is the whole reason to do this carefully."
    notes: |
      Four beats. First, the conceptual bridge from an LLM Process, and why an agent
      still drops into this morning's evaluation harness. Second, the anatomy of the
      Analyst Agent and the capabilities its components unlock — which we run live.
      Third — the part I most want you to remember — a real war story: this agent once
      looked brilliant, and it was cheating. I'll show how we caught it, fixed it, and
      the uncomfortable lesson underneath. And fourth, the payoff: one identity doing
      three jobs, one of which isn't a scored forecast at all.

  # 3 — From a process to an agent
  - layout: compare
    title: From a process to an agent
    left:
      label: LLM Process
      lines:
        - "Context packed into the prompt"
        - "You choose what it sees"
        - "One shot: prompt to forecast"
    right:
      label: Agent
      lines:
        - "Goes and gets the context"
        - "Searches, computes, decides"
        - "A loop: act, observe, act"
    callout: "Same goal — a calibrated forecast. New ability: it can act before it answers."
    notes: |
      An LLM Process is a single shot: you assemble the context — the series, maybe a
      report — pack it into the prompt, and read a forecast back. It's powerful, but it
      only ever sees what you handed it. An agent flips the responsibility. Instead of
      you pre-loading every relevant fact, the agent has tools — web search, a Python
      sandbox — and runs a loop: it reasons, decides it needs something, fetches or
      computes it, looks at the result, and goes again until it's ready to answer. The
      goal is identical — a calibrated probabilistic forecast. The new ingredient is
      agency: it can take actions in the world before it commits to a number.

  # 4 — Thesis
  - layout: statement
    statement: "An agent is an LLM that can act."
    support: "Search for context, run code, decide when — then forecast."
    callout: "And it still implements the same one interface."
    notes: |
      The one sentence to hold onto: an agent is an LLM that can act — search, compute,
      and crucially decide when each is worth doing — and then forecast. Everything else
      today is detail on top of that. And the part that makes it usable for us: no matter
      how many tools we bolt on, it still presents the same interface as every other
      method. That's what lets an agent and a fifty-year-old statistical model compete on
      the same scoreboard.

  # 5 — Still just a Predictor (real code)
  - layout: code
    title: Still just a Predictor
    language: python
    code: |
      config = build_wti_news_config()
      predictor = build_wti_news_predictor(
          task="trajectory")
      # AgentPredictor implements Predictor:
      predictor.predict(task, context)
      #   -> list[Prediction]
    side:
      heading: "The harness can't tell."
      body: "An AgentConfig becomes an AgentPredictor implementing predict() — the same ABC as ARIMA."
      points:
        - "backtest() treats it identically"
        - "evaluate() scores it the same"
    caption: "energy_oil_forecasting/tasks.py · analyst_agent/agent.py"
    notes: |
      This is the whole trick to integrating agents honestly. This morning we saw the
      Predictor base class — one method, predict, takes a task and a cutoff-scoped
      context, returns a probabilistic prediction. Here, build_wti_news_config defines
      an agent identity — its instructions and its tools — and AgentPredictor wraps that
      identity so it satisfies the exact same interface. To backtest() and evaluate(),
      this agent is indistinguishable from a Darts ARIMA. So what's actually inside that
      wrapper? Let's open it up.

  # 6 — Anatomy of the Analyst Agent (architecture diagram)
  - layout: figure_full
    title: Anatomy of the Analyst Agent
    image: ../../assets/figures/d1-04/agent_architecture.png
    caption: "One identity wrapped as a Predictor: instructions + tools + skills + an output schema."
    notes: |
      Here's the whole Analyst Agent on one slide — and we'll reuse this exact diagram
      tomorrow, so it's worth a minute. On the left, the inputs: the task and a
      cutoff-scoped context, same as every method. In the center, the LLM core running an
      act-observe loop, steered by its instructions. Around it, the tool belt: a bounded
      web search, a sandboxed Python environment, and optionally a conventional forecast
      tool. Hanging off the side, skills — read-only reference material the agent pulls in
      on demand. On the right, the output schema that turns its answer into a standard
      Prediction. The whole thing is wrapped as an AgentPredictor, the only surface the
      harness sees. Notice the dashed box: that's the slot tomorrow's adaptive agent fills
      with a strategy it can rewrite. Today everything in here is fixed at config time.

  # 7 — Section break
  - layout: section
    eyebrow: Capabilities
    title: Capabilities are configuration
    subtitle: "Which components are live"
    notes: |
      With the anatomy in mind: every 'capability level' is just a choice of which of
      those components we switch on.

  # 8 — Four configs, one identity
  - layout: numbered_list
    title: Four configs, one identity
    items:
      - { title: "Basic", desc: "Core + history only — no tools (the LLMP-style baseline, our floor)" }
      - { title: "News", desc: "+ search_web — reasons over OPEC+, geopolitics, supply it couldn't otherwise see" }
      - { title: "Code", desc: "+ run_code (E2B) + skills — computes vol, fits a trend, calibrates intervals" }
      - { title: "Tool", desc: "+ run_forecast (AutoARIMA) — less flexible, but rigid, auditable, reproducible" }
    notes: |
      Four configurations of that one architecture. The basic agent lights up only the
      core with price history — essentially an LLM Process with a reasoning loop. News
      switches on the search tool, so it can react to what a numbers-only model can't see:
      an OPEC+ decision, a shipping-lane closure, an escalation in the Gulf. Code switches
      on the sandbox and the skills, so it stops guessing at statistics and actually
      computes them — realized volatility, a rolling trend fit, a calibrated interval. And
      the fourth swaps open-ended code for a single AutoARIMA tool — less flexible, but
      rigid and auditable. In the code these are four factory functions differing by a few
      fields each. Same identity, four capability levels — let's run the full one.

  # 9 — LIVE demo (rendered fallback on screen)
  - layout: figure
    title: Reacting to the news
    badge: "LIVE DEMO"
    image: ../../assets/figures/d1-04/news_agent_forecast.png
    caption: "WTI · news agent vs AutoARIMA · one 2025 backtest origin."
    side:
      heading: "A reasoned forecast, not a flat line."
      body: "The agent commits to a directional call with a calibrated band — a move AutoARIMA's flat line never makes."
      points:
        - "Realized stayed inside the band"
    notes: |
      Rather than just tell you, let me run it — the Analyst Agent with news search on,
      on a recent origin. [Run.] Watch the trace: it decides what it needs, issues a
      search, reads the result — an OPEC+ headline, a note on the Gulf — then folds that
      into a forecast, and the median moves off the naive extrapolation toward the regime
      the news implies. [Fallback:] if the live call is slow, this plot is the news agent
      on a 2025 backtest origin — it commits to a directional call with a calibrated band,
      and the realized path stays inside it. This is NOT a cherry-picked accuracy win — on
      big moves the agent often misses direction — the point is that each capability does
      something legible, and you can decide if it's worth the cost. This is notebook 2;
      you can run it yourself this afternoon.

  # 10 — Two kinds of cutoff
  - layout: compare
    title: Two kinds of cutoff
    style: emphasis
    left:
      label: The data (hard)
      lines:
        - "CutoffEnforcer filters rows"
        - "Never sees released_at > as_of"
        - "Structural — can't be violated"
    right:
      label: The web (soft)
      lines:
        - "Search passes cutoff_date = as_of"
        - "Proxy is asked to exclude later"
        - "A discipline, not a guarantee"
    callout: "You can fence the data. You can't structurally fence the open web."
    notes: |
      You just watched it search the web — so we have to confront the honest crux of
      agentic forecasting. For the data, the cutoff is hard and structural: CutoffEnforcer
      filters every row by its release date before the agent sees anything, so post-origin
      data simply isn't in the context — the agent can't cheat. For the web, there's no
      such guarantee. Every search carries a cutoff_date equal to the forecast origin, and
      the search proxy is instructed to exclude anything later — and it mostly complies —
      but that's the model exercising judgment, not a wall. A live model has a training
      cutoff of its own, and a live search can always surface something stamped after the
      date. So for any agent with live tools, the cutoff is a discipline we enforce by
      governance and disclosure, not a property we can prove.

  # 11 — War story: a leak we shipped (section)
  - layout: section
    eyebrow: A true story from this repo
    title: A leak we shipped
    subtitle: "The agent that looked brilliant — because it was cheating"
    notes: |
      We've said the web can't be structurally fenced. Let me stop saying it and show
      you — because we didn't catch this in theory, we caught it in our own numbers. For a
      stretch, this exact news agent was our best forecaster on the energy use case: beat
      ARIMA, beat LightGBM, beat the LLM-process baselines. We were, briefly, delighted.
      Then we looked closer, and it turned out the agent was best in the room because it
      had seen the answer sheet. Here's how that unravelled.

  # 12 — The smoking gun (HERO figure)
  - layout: figure
    title: The smoking gun
    image: ../../assets/figures/d1-04/leakage_crps_by_horizon.png
    caption:
      lead: "WTI news agent · CRPS by horizon · 2026 eval."
      body: "Uncertainty must compound with horizon — the leaked agent's didn't."
    side:
      heading: "Too good to be true."
      points:
        - "Flat CRPS across every horizon"
        - "Honest methods ~triple by 21d"
        - "Flat = it already knew the answer"
    notes: |
      This is the whole tell on one chart. CRPS is our forecast score, lower is better,
      broken out by how far ahead we forecast: 5, 10, 21 days. Look at the honest methods
      first — AutoARIMA, Naive. Their error roughly triples as the horizon grows, because
      of course it does: three weeks out is much harder than a few days out. Now the pre-fix
      agent, the flat line: about 5.6 the whole way. That is not skill. A forecaster whose
      uncertainty doesn't grow with the horizon already knows how it ends. Plug the leak and
      the same agent's curve springs back to the normal shape — and its overall score gets
      worse by forty-two percent. That gap, 5.6 to 8.0, is the exact size of the cheating.

  # 13 — How we caught it
  - layout: compare
    title: How we caught it
    left:
      label: The fingerprint
      lines:
        - "Flat CRPS across 5 / 10 / 21d"
        - "Beat every baseline at 21 days"
        - "Bands too tight to be honest"
    right:
      label: The confession
      lines:
        - "We read the agent's search trace"
        - "11 of 14 searches skipped the cutoff"
        - "A result dated ~6 weeks past origin"
    callout: "The score raised the suspicion; the trace proved it."
    notes: |
      Two steps, and this is a repeatable way to smell leakage. Step one, the fingerprint:
      the score pattern, plus a newcomer suddenly beating a fifty-year-old model at the
      longest horizon — exactly where a real edge is hardest to get. Suspicious, not proof.
      Step two, the confession: because every run is traced, we opened the actual tool calls
      in Langfuse. In one production trace, 11 of the agent's 14 web searches had dropped
      the cutoff argument, and one came back with prices dated roughly six weeks after the
      forecast origin. The agent was reading July's prices to forecast May. There it is. A
      scoreboard tells you something's wrong; your traces tell you what.

  # 14 — Three tries to plug a leak
  - layout: numbered_list
    title: Three tries to plug a leak
    items:
      - { title: "Stronger prompt — it failed",
          desc: "'Only use pre-cutoff sources.' A model can't police where its words came from." }
      - { title: "Independent verifier (#161)",
          desc: "A different model audits each claim vs the cutoff, strips it, or fails loud." }
      - { title: "Harness-enforced cutoff (#162)",
          desc: "The origin is injected by the harness — the LLM can't see, omit, or spoof it." }
    notes: |
      Fixing it took three tries, and the arc is the real lesson. First, the obvious thing:
      a sterner instruction — 'only use sources before the cutoff, this is critical.' It
      didn't hold, and here's the deep point: a single model genuinely cannot tell whether a
      fact it wrote down came from the search in front of it or from its own training. No
      prompt fixes that. So the second fix was architectural — a separate verifier model
      whose only job is to judge each claim against the cutoff and strip what fails, retrying
      or failing loudly rather than returning contaminated text. Better — but it only ran
      when the agent remembered to pass the cutoff, and it often didn't. So the third fix
      took the cutoff away from the model entirely: the harness injects the forecast origin
      through a channel the LLM can't see, omit, or spoof. Belt, then suspenders, then a lock
      the prisoner doesn't hold the key to. The fix that worked was architectural — not
      another paragraph of prompt.

  # 15 — How the pieces work together (agentic-system diagram)
  - layout: figure_full
    title: How the pieces work together
    image: ../../assets/figures/d1-04/agentic_system.png
    callout: "No single model polices itself — and the cutoff comes from the harness, not the LLM."
    notes: |
      Step back and look at what that fix actually built — this shape is worth recognizing,
      because it's what a lot of real agent systems look like under the hood, and it's more
      than one model. The analyst is really an orchestrator: for news it delegates to a
      sub-agent whose whole job is retrieval, and that sub-agent calls the search tool. The
      crucial part: raw hits don't go straight back. They pass through a separate verifier —
      a different model whose only job is to check each claim against the cutoff and throw out
      anything after it, retrying up to three times or failing loudly rather than passing
      contaminated text. Only verified context flows back to the analyst, which turns it into
      the forecast. Two choices make this robust rather than hopeful: no single model polices
      itself — the checker is independent of what it checks — and the cutoff isn't something
      the LLM types, it's injected by the harness in a channel the model can't see or change.
      That's the difference between a system that asks to be honest and one that's built to be.

  # 16 — One polluted, one honest
  - layout: compare
    title: One polluted, one honest
    style: emphasis
    left:
      label: Polluted (pre-fix)
      lines:
        - "Cited prices past the origin"
        - "The search skipped the cutoff"
        - "No trace link — unauditable"
    right:
      label: Self-corrected (post-fix)
      lines:
        - "Cites only facts at the cutoff"
        - "Feb 2: WTI settled $62.14"
        - "Then projects — one click to the trace"
    callout: "Same agent, same question — one had seen the future, one hadn't."
    notes: |
      Concretely, the same agent before and after. On the left, the polluted behaviour: a
      rationale leaning on prices that hadn't happened yet, from a search that skipped the
      cutoff — and tellingly, the pre-fix predictions don't even carry a trace link, so you
      couldn't audit them if you wanted to. On the right, a real post-fix run from the
      committed results, forecasting from February 2nd, 2026. Every fact it cites sits at or
      before that date — 'as of February 2nd, WTI retreated three dollars to settle at
      $62.14' — and then it projects forward. That's honest reasoning: it anchors on what
      was knowable, and it's fully auditable — every one carries a Langfuse link you can
      open. Same brain, same question. The only difference is whether it was allowed to peek.

  # 17 — The hard truth
  - layout: statement
    statement: "You can't un-leak a live backtest."
    support: "A live web index always knows how the story ends."
    callout: "Separate fenced backtests from live runs — and say which is which."
    notes: |
      Now the uncomfortable part — straight with you, rather than selling something. We
      fixed this leak. But step back: we're backtesting an agent whose whole value is live
      web access, over a period the live web has already fully indexed and written up. Even
      with a perfect cutoff on the search tool, the model's own training has a cutoff, and
      the internet is saturated with hindsight about 2025 and early 2026. You can reduce the
      leakage — we did, a lot — but you cannot prove it's gone. A live backtest can never be
      as clean as a genuine forecast into an unknown future. So the discipline is: keep
      fenced backtests and live runs in separate cohorts, and always say which is which.
      Honesty about the limitation beats a false guarantee.

  # 18 — So why keep going? (positive close of the act)
  - layout: icon_cards
    title: So why keep going?
    cards:
      - { icon: chart, title: "Still the frontier", accent: pink,
          body: "LLMs lead automated forecasting — ForecastBench has humans still ahead, but not for lack of trying." }
      - { icon: search, title: "Live eval is the answer", accent: purple,
          body: "Forecast a truly un-indexed future: no cutoff to fence, nothing to filter, nothing to leak." }
      - { icon: arrow, title: "Beyond the bootcamp", accent: blue,
          body: "Take the agents that look good here to real live eval — where the score finally means it." }
    callout: "The leak is a backtesting artifact — not a verdict on the agents."
    notes: |
      So if backtests are structurally suspect, why are we here? Two reasons. One: even
      accounting for all of this, agentic LLM forecasters are the frontier of automated
      forecasting right now — ForecastBench, the leakage-free benchmark of genuinely
      unresolved future questions, still has expert humans ahead of the models, but the
      models are the best automated forecasters we've got and they're improving fast. Two,
      the punchline of the session: the honest way to evaluate a live-data agent isn't a
      cleaner backtest — it's a live evaluation. Point it at questions whose answers don't
      exist yet, and wait. No cutoff to enforce, nothing to filter, because there's no
      future to leak. That's the natural next step past a bootcamp. The leak we walked
      through is an artifact of backtesting — not a verdict on the agents. With that honestly
      on the table, let me show you the rest of what this one identity can do.

  # 19 — Skills: competence by configuration
  - layout: icon_cards
    title: Competence by configuration
    cards:
      - { icon: flask, title: "statistical-analysis", accent: pink,
          body: "Classifies the vol regime and spots anomalies, grounded in a JSON of real 2020–25 WTI benchmarks." }
      - { icon: chart, title: "trend-projection", accent: purple,
          body: "A worked recipe: fit a trend on recent days, project to each horizon, calibrate an 80% interval." }
      - { icon: code, title: "E2B sandbox", accent: blue,
          body: "It reads the skills, then writes and runs the actual Python in an isolated, open-ended sandbox." }
    callout: "We upgraded competence by adding two folders to a list — configuration, not code."
    notes: |
      Zooming into the code component from the diagram: we didn't just hand the agent a
      bare Python prompt — we gave it skills, read-only folders of instructions and
      reference data it pulls in on demand. It gets two. statistical-analysis teaches it
      to classify the volatility regime and spot anomalies, and ships a JSON of real
      2020-to-2025 WTI benchmarks so its sense of 'normal' is grounded in numbers, not
      vibes. trend-projection gives it a worked recipe — fit a trend on recent days,
      project to each horizon, calibrate an 80% interval from the residuals. It reads
      those, then writes and runs the real Python in an isolated E2B sandbox. The point:
      we upgraded the agent's analytical competence by adding two folders to a list — no
      fine-tuning, no redeploy. Configuration, not code, one more time.

  # 20 — Section break
  - layout: section
    eyebrow: Configuration, not code
    title: One agent, three jobs
    subtitle: "Same identity — different question"
    notes: |
      We've seen one capable agent. Now watch the same identity do three completely
      different jobs — and watch one of them stop being a scored forecast at all.

  # 21 — One identity, three tasks
  - layout: table
    title: One identity, three tasks
    subtitle: "One AgentConfig, paired with three (prompt, output schema) combinations"
    headers: ["Task", "Output schema", "Track", "Score"]
    rows:
      - ["Trajectory", "Quantile grid", "1", "CRPS"]
      - ["Binary shock", "Probability", "1", "Brier"]
      - ["Scenario", "Scenario cards", "2", "—"]
    notes: |
      This is the one-agent-three-tasks pattern, and it's just tasks.py. One AgentConfig
      identity — the same news agent — paired with three different (prompt_builder,
      output_schema) combinations. Ask it for a trajectory and it returns a quantile
      forecast scored by CRPS — Track 1, head-to-head. Ask it for a binary shock — will
      WTI jump more than five dollars in a week — and it returns a probability scored by
      Brier; still Track 1. Or ask it for a scenario analysis, and it returns something
      structured but unscored — that's Track 2. Same brain, three jobs, picked by which
      output schema you hand it. That last row is the interesting one.

  # 22 — Track 2: the agent as analyst (real schema)
  - layout: code
    title: "Track 2: the agent as analyst"
    language: python
    code: |
      class ScenarioCard(BaseModel):
          name: str
          description: str
          probability: float   # 0–1
          wti_range_60d: list[float]
          point_estimate_60d: float
          key_drivers: list[str]
      # output: list[ScenarioCard] + base_case
    side:
      heading: "Not a score — an analysis."
      body: "Same agent, swap the output schema: weighted scenarios with ranges and drivers."
      points:
        - "Judged by usefulness, not CRPS"
        - "Meant to support a decision"
    caption: "energy_oil_forecasting/tasks.py"
    notes: |
      Here's what Track 2 looks like. Instead of one number, the agent returns three
      scenarios — a supply-shock case, a base case, a demand-softening case — each with a
      probability, a 60-day price range, and the key drivers behind it. There's no CRPS
      here, and that's the point: this output isn't competing on a leaderboard, it's meant
      to support a human decision. This is the 'agents as prediction analysts' mode the
      intro framed this morning, made concrete — and it falls out of the same agent just by
      swapping the output schema. One capable identity spans both the scored forecaster and
      the interactive analyst.

  # 23 — What to take forward
  - layout: cards_dense
    title: What to take forward
    columns: 3
    style: outline
    cards:
      - { eyebrow: "01", title: "Capabilities are config", metric: "one interface", accent: pink,
          desc: "News, code, skills, tools — toggles on one Predictor identity." }
      - { eyebrow: "02", title: "A great score can be a leak", metric: "flat CRPS", accent: purple,
          desc: "The tell was a curve that wouldn't grow; the fix was architectural." }
      - { eyebrow: "03", title: "Live backtests can't be clean", metric: "go live", accent: blue,
          desc: "The honest next step is live eval — where nothing's left to leak." }
    callout: "Tomorrow: an agent that rewrites its own forecasting strategy."
    notes: |
      Three things to carry forward. One: every capability we added — news, code, skills,
      tools — was configuration on a single identity that never stopped being a Predictor,
      which keeps agents on the same honest scoreboard as everything else. Two, the one I
      most want to stick: a suspiciously good score can be a leak. Our best forecaster was
      cheating, and the tell was a CRPS curve that refused to grow with the horizon — you
      now know that smell, and you know the fix is architectural, a check the model can't
      talk its way around, not a sterner prompt. Three: you cannot fully un-leak a backtest
      of a live-data agent, so the real evaluation is a live one — point it at a future that
      hasn't happened and wait. That's the honest frontier past this bootcamp. Hold onto the
      architecture diagram, because tomorrow I fill its empty slot with a strategy the agent
      rewrites itself, and we measure whether that actually helps on a protected 2026 window.
      Thanks — and after lunch we'll get hands-on.
